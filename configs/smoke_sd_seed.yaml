# CPU 연기 테스트 전용. 수치는 의미 없다 — SD 경로가 끝까지 도는지만 본다.
data:
  root: /mnt/data/original/SEED
  subjects: null
  sessions:
  - 1
  segment_length: 800
  step: 800
  patch_size: 200
  norm: scale100
  ea: true
  ea_scope: session
  ea_scale: 0.2
  ea_trim: 0.05
  ea_eps: 1.0e-06
  ea_mode: diag
labram:
  repo_path: /home/kihyeonjoo/LaBraM
  ckpt_path: /home/kihyeonjoo/LaBraM/checkpoints/labram-base.pth
  model_name: labram_base_patch200_200
model:
  d_model: 256
  n_heads: 8
  n_layers: 3
  dim_feedforward: 512
  dropout: 0.1
  n_masked_ch: 5
training:
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.01
  epochs: 50
  device: cpu
  lambda_aux: 0.5
  lambda_cos: 0.5
  lambda_aux_init: 0.1
  lambda_warmup_epochs: 10
  log_every: 10
  save_every: 10
  checkpoint_dir: checkpoints_labram
finetune:
  pretrained_ckpt: checkpoints_labram/pretrain_epoch050.pt
  skip_adapter_pretrain: true
  n_classes: 3
  device: cpu
  verbose: true
  eval_every_epoch: true
  use_lora: false
  batch_size: 64
  lr: 0.0005
  weight_decay: 0.05
  epochs: 3
  warmup_epochs: 1
  layer_decay: 0.65
  clip_grad: 3.0
  label_smoothing: 0.1
  dropout: 0.0
  lambda_asym: 0.0
  lora_r: 8
  lora_alpha: 16.0
  lora_lr: 0.0002
  sd_train_per_session: 9
  n_val_subjects: 2
  amp: true
  seeds:
  - 0
  sd_val_frac: 0.2
  results_csv: /tmp/claude-1009/smoke_smoke_sd_seed.yaml.csv
