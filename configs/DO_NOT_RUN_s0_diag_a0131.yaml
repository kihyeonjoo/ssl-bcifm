data:
  root: /mnt/data/original/SEED
  subjects: null
  sessions: null
  segment_length: 800
  step: 800
  patch_size: 200
  norm: scale100
  ea: true
  ea_scope: session
  ea_scale: 0.131
  ea_trim: 0.05
  ea_eps: 1.0e-06
  ea_mode: diag
labram:
  repo_path: /home/kihyeonjoo/LaBraM
  ckpt_path: /home/kihyeonjoo/LaBraM/checkpoints/labram-base.pth
