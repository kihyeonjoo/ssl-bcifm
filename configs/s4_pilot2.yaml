data:
  root: /mnt/data/original/SEED
  subjects: null
  sessions: null
  segment_length: 800
  step: 800
  patch_size: 200
  norm: scale100
  ea: true
  ea_scope: session
  ea_scale: 0.2
  ea_trim: 0.05
  ea_eps: 1.0e-06
  ea_mode: diag
labram:
  repo_path: /home/kihyeonjoo/LaBraM
  ckpt_path: /home/kihyeonjoo/LaBraM/checkpoints/labram-base.pth
  model_name: labram_base_patch200_200
model:
  d_model: 256
  n_heads: 8
  n_layers: 3
  dim_feedforward: 512
  dropout: 0.1
  n_masked_ch: 5
training:
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.01
  epochs: 50
  device: cuda
  lambda_aux: 0.5
  lambda_cos: 0.5
  lambda_aux_init: 0.1
  lambda_warmup_epochs: 10
  log_every: 10
  save_every: 10
  checkpoint_dir: checkpoints_labram
finetune:
  pretrained_ckpt: checkpoints_labram/pretrain_epoch050.pt
  skip_adapter_pretrain: true
  n_classes: 3
  device: cuda
  verbose: true
  eval_every_epoch: true
  use_lora: false
  batch_size: 64
  lr: 0.0005
  weight_decay: 0.05
  epochs: 50
  warmup_epochs: 5
  layer_decay: 0.65
  clip_grad: 3.0
  label_smoothing: 0.1
  dropout: 0.0
  lambda_asym: 0.0
  lora_r: 8
  lora_alpha: 16.0
  lora_lr: 0.0002
  sd_train_per_session: 9
  n_val_subjects: 2
  amp: true
  seeds: [0, 1, 2]
  save_logits: logits/pilot2_S{fold}_seed{seed}.npz
  save_state: checkpoints_s0/pilot2_S{fold}_seed{seed}.pt
  results_csv: results/pilot2_dc.csv
  domain_center: true
  center_diag: true
  center_diag_windows: 64
  center_refresh_steps: 237      # 473 스텝/epoch 이므로 epoch당 2회 (중간, 끝)
  center_refresh_windows: 0     # 0 = 전체 학습창. M=256 이상이어야 잡음<낡음인데, 그러면 전체 패스가 더 싸다
  center_fresh_eval: true       # val/test 테이블을 평가 직전에 계산
