# LaBraM + AsymmetryAdapter pipeline (Strategy 2)

data:
  root: /mnt/data/original/SEED
  subjects: null
  sessions: null
  segment_length: 800    # samples (4 s @ 200 Hz)
  step: 200              # sliding stride (1 s, 75% overlap)
  patch_size: 200        # LaBraM patch size (1 s)
  norm: scale100         # scale100 = LaBraM official (µV → 0.1 mV) | zscore | none

labram:
  repo_path: /home/kihyeonjoo/LaBraM
  ckpt_path: /home/kihyeonjoo/LaBraM/checkpoints/labram-base.pth
  model_name: labram_base_patch200_200

model:
  d_model: 256           # adapter hidden dim
  n_heads: 8
  n_layers: 3            # small adapter on top of LaBraM
  dim_feedforward: 512
  dropout: 0.1
  n_masked_ch: 5         # channels masked for ℒ_main

training:
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 1.0e-2
  epochs: 50
  device: cuda
  lambda_aux: 0.5
  lambda_cos: 0.5
  lambda_aux_init: 0.1
  lambda_warmup_epochs: 10
  log_every: 10
  save_every: 10
  checkpoint_dir: checkpoints_labram

finetune:
  pretrained_ckpt: checkpoints_labram/pretrain_epoch050.pt
  skip_adapter_pretrain: true
  n_classes: 3
  device: cuda
  verbose: true
  eval_every_epoch: true

  # === LaBraM official settings ===
  use_lora: false          # false = full fine-tune (official)
  batch_size: 64
  lr: 5.0e-4
  weight_decay: 0.05
  epochs: 50
  warmup_epochs: 5
  layer_decay: 0.65        # layer-wise LR decay
  clip_grad: 3.0
  label_smoothing: 0.1
  dropout: 0.0             # LaBraM official uses drop_path, not head dropout

  # Hemisphere auxiliary loss
  lambda_asym: 0.0         # 0 = LaBraM only baseline, >0 = hemisphere aux

  # LoRA (only when use_lora: true)
  lora_r: 8
  lora_alpha: 16.0
  lora_lr: 2.0e-4

  # SEED official subject-dependent protocol: clips 1-9 train / 10-15 test,
  # applied inside each session and averaged over the 3 sessions.
  sd_train_per_session: 9
