data:
  root: /mnt/data/original/SEED
  subjects: null        # null = all 15 subjects
  sessions: null        # null = all 3 sessions
  segment_length: 800   # samples  (4 s @ 200 Hz)
  step: 200             # sliding-window step (1 s, 75 % overlap)
  n_fft: 200            # FFT size → 1 Hz/bin at 200 Hz
  hop_length: 40        # STFT hop  → 0.2 s time step

model:
  n_channels_per_hemi: 27
  n_bands: 4
  d_model: 256
  cnn_channels: [32, 64, 128]   # SpectroSpatialCNN hidden stages
  n_heads: 8                    # TemporalTransformer attention heads
  n_layers: 4                   # Transformer depth
  dim_feedforward: 1024
  dropout: 0.1

training:
  batch_size: 64
  lr: 1.0e-3
  weight_decay: 1.0e-2
  epochs: 100
  device: cuda
  lambda_aux: 0.5       # final weight for ℒ_aux in total loss
  lambda_cos: 0.5       # weight for cosine term inside ℒ_aux
  lambda_aux_init: 0.1  # λ at epoch 0 (warm-up start)
  lambda_warmup_epochs: 20  # epochs to linearly ramp λ from init → final
  mask_sigma: 0.3       # Gaussian σ for band masking (smaller = harder)
  log_every: 10         # log metrics every N steps
  save_every: 10        # save checkpoint every N epochs
  checkpoint_dir: checkpoints

finetune:
  pretrained_ckpt: checkpoints/pretrain_epoch100.pt
  n_classes: 3
  batch_size: 64
  lr: 2.0e-4             # head LR (lowered from 5e-4 for stability)
  encoder_lr: 1.0e-5     # lower LR for pretrained encoder (full FT mode)
  weight_decay: 1.0e-2
  epochs: 30
  warmup_epochs: 3       # linear LR warmup over first N epochs
  dropout: 0.2
  label_smoothing: 0.1   # regularize overconfident single-class predictions
  freeze_encoder: false   # false = full fine-tuning with differential LR
  device: cuda

  # Diagnostics
  verbose: true          # print per-epoch train loss/acc
  eval_every_epoch: true # also print test acc/f1 each epoch (slower but informative)

  # LoRA settings (overrides freeze_encoder / encoder_lr when use_lora=true)
  use_lora: false        # disabled by default — first confirm full FT works
  lora_r: 8              # rank of low-rank adaptation
  lora_alpha: 16.0       # scaling factor (effective update ≈ α/r)
  lora_dropout: 0.0
  lora_lr: 2.0e-4        # LoRA adapter learning rate

  # Subject-dependent split: first N trials train, rest test
  # (SEED has 45 trials per subject = 3 sessions × 15.
  #  Default 30 = sessions 1+2 train, session 3 test)
  sd_train_trials: 30
